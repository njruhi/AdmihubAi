<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="description" content="AdmihubAi — বিশ্ববিদ্যালয় ভর্তি পরীক্ষা (মানবিক বিভাগ / Arts Unit) প্রস্তুতির জন্য প্রিমিয়াম পার্সোনাল AI স্টাডি এজেন্ট ও লার্নিং প্ল্যাটফর্ম।" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230A84FF'/%3E%3Cstop offset='1' stop-color='%23BF5AF2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Cpath d='M50 22 18 74h13l6-11h26l6 11h13L50 22zm0 20 9 16H41l9-16z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>AdmihubAi · মানবিক ভর্তি প্রস্তুতি AI</title>
    <script>
      // Prevent theme flash — apply stored theme before first paint
      (function () {
        try {
          var raw = localStorage.getItem('admihub.settings')
          var theme = raw ? JSON.parse(raw).theme : null
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="boot">
      <div class="boot-logo"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
